name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify release candidate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/controlplane/package-lock.json

      - name: Install frontend dependencies
        run: npm.cmd --prefix web/controlplane ci

      - name: Release check
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\release-check.ps1

      - name: Local package
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\local-package.ps1

      - name: Upload local package
        uses: actions/upload-artifact@v4
        with:
          name: quotarelay-pr-local-package
          path: target/local-package/*.zip
          if-no-files-found: error

      - name: Dependency audit
        run: npm.cmd --prefix web/controlplane audit --audit-level=moderate
