openapi: 3.1.0
info:
  title: Quotarelay Control Plane API
  version: 0.1.0
  description: Shipped backend truth surface for the Quotarelay control plane.
paths:
  /truth:
    get:
      operationId: getBackendTruth
      summary: Return the current backend truth payload for the control plane.
      responses:
        '200':
          description: Current backend tool registry, retrieval contract, and proof commands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendTruthPayload'
  /repositories:
    get:
      operationId: getRepositoryState
      summary: Return registered repository state for an explicit local state root.
      parameters:
        - name: root
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
      responses:
        '200':
          description: Bounded registered repository state derived from backend truth.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegisteredRepositoryState'
        '400':
          $ref: '#/components/responses/BadRequestText'
        '500':
          $ref: '#/components/responses/InternalErrorText'
  /memory:
    get:
      operationId: getMemorySearch
      summary: Return bounded durable memory search results for an explicit local state root and query.
      parameters:
        - name: root
          in: query
          required: true
          schema:
            type: string
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5
      responses:
        '200':
          description: Bounded durable memory search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemorySearchResult'
        '400':
          $ref: '#/components/responses/BadRequestText'
        '500':
          $ref: '#/components/responses/InternalErrorText'
  /context-runs:
    get:
      operationId: getContextRuns
      summary: Return bounded recent context runs for an explicit local state root.
      parameters:
        - name: root
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5
      responses:
        '200':
          description: Bounded context runs with inclusion and omission reasons.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContextAssembly'
        '400':
          $ref: '#/components/responses/BadRequestText'
        '500':
          $ref: '#/components/responses/InternalErrorText'
components:
  responses:
    BadRequestText:
      description: Plain-text validation error for missing or empty query parameters.
      content:
        text/plain:
          schema:
            type: string
    InternalErrorText:
      description: Plain-text backend error for local state or filesystem failures.
      content:
        text/plain:
          schema:
            type: string
  schemas:
    BackendTruthPayload:
      type: object
      additionalProperties: false
      required:
        - tools
        - retrieval
        - cache
        - config
        - cli
        - proofs
      properties:
        tools:
          type: array
          items:
            $ref: '#/components/schemas/ToolDescriptor'
        retrieval:
          $ref: '#/components/schemas/RetrievalTruth'
        cache:
          $ref: '#/components/schemas/CacheTruth'
        config:
          $ref: '#/components/schemas/ConfigTruth'
        cli:
          $ref: '#/components/schemas/CliTruth'
        proofs:
          type: array
          items:
            $ref: '#/components/schemas/BackendProof'
    ToolDescriptor:
      type: object
      additionalProperties: false
      required:
        - name
        - description
        - inputSchema
      properties:
        name:
          type: string
        description:
          type: string
        inputSchema:
          $ref: '#/components/schemas/ToolInputSchema'
    ToolInputSchema:
      type: object
      description: JSON schema fragment serialized by the MCP tool registry.
      required:
        - type
        - properties
        - additionalProperties
      properties:
        type:
          type: string
          const: object
        properties:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ToolInputProperty'
        required:
          type: array
          items:
            type: string
        additionalProperties:
          type: boolean
      additionalProperties: true
    ToolInputProperty:
      type: object
      properties:
        type:
          type: string
        enum:
          type: array
          items:
            type: string
        default: {}
        minimum:
          type: integer
        maximum:
          type: integer
        items:
          oneOf:
            - $ref: '#/components/schemas/ToolInputProperty'
            - type: object
              additionalProperties: true
      additionalProperties: true
    RetrievalTruth:
      type: object
      additionalProperties: false
      required:
        - modes
        - inclusion_reason_kinds
        - omission_reason_kinds
        - limits
        - durable_memory_enabled
        - budget_estimate_enabled
        - budget_estimate_unit
        - cache
      properties:
        modes:
          type: array
          items:
            $ref: '#/components/schemas/RetrievalMode'
        inclusion_reason_kinds:
          type: array
          items:
            $ref: '#/components/schemas/InclusionReasonKind'
        omission_reason_kinds:
          type: array
          items:
            $ref: '#/components/schemas/OmissionReasonKind'
        limits:
          $ref: '#/components/schemas/RetrievalLimits'
        durable_memory_enabled:
          type: boolean
        budget_estimate_enabled:
          type: boolean
        budget_estimate_unit:
          type: string
        cache:
          $ref: '#/components/schemas/CacheTruth'
    CacheTruth:
      type: object
      additionalProperties: false
      required:
        - exact_search_enabled
        - overview_enabled
        - task_capsule_enabled
        - sync_invalidates_caches
      properties:
        exact_search_enabled:
          type: boolean
        overview_enabled:
          type: boolean
        task_capsule_enabled:
          type: boolean
        sync_invalidates_caches:
          type: boolean
    ConfigTruth:
      type: object
      additionalProperties: false
      required:
        - workspace_profiles_enabled
        - workspace_profiles_apply_to_retrieval
        - max_workspace_profiles
        - max_profile_repo_roots
        - default_mode
        - default_limit
        - per_repo_limit
      properties:
        workspace_profiles_enabled:
          type: boolean
        workspace_profiles_apply_to_retrieval:
          type: boolean
        max_workspace_profiles:
          type: integer
        max_profile_repo_roots:
          type: integer
        default_mode:
          $ref: '#/components/schemas/RetrievalMode'
        default_limit:
          type: integer
        per_repo_limit:
          type: integer
    CliTruth:
      type: object
      additionalProperties: false
      required:
        - local_entrypoint_enabled
        - commands
      properties:
        local_entrypoint_enabled:
          type: boolean
        commands:
          type: array
          items:
            $ref: '#/components/schemas/CliCommandTruth'
    CliCommandTruth:
      type: object
      additionalProperties: false
      required:
        - label
        - command
      properties:
        label:
          type: string
        command:
          type: string
    RegisteredRepositoryState:
      type: object
      additionalProperties: false
      required:
        - repository
        - sync
        - recent_context_run
      properties:
        repository:
          $ref: '#/components/schemas/RegisteredRepository'
        sync:
          $ref: '#/components/schemas/RepositorySyncState'
        recent_context_run:
          nullable: true
          oneOf:
            - $ref: '#/components/schemas/LastContextRunSummary'
    RegisteredRepository:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - root
        - registered_at_epoch_ms
      properties:
        id:
          type: string
        name:
          type: string
        root:
          type: string
        registered_at_epoch_ms:
          type: integer
    RepositorySyncState:
      type: object
      additionalProperties: false
      required:
        - status
        - indexed_files
        - indexed_at_epoch_ms
      properties:
        status:
          type: string
          enum:
            - not_indexed
            - indexed
        indexed_files:
          type: integer
        indexed_at_epoch_ms:
          type: integer
          nullable: true
    LastContextRunSummary:
      type: object
      additionalProperties: false
      required:
        - query
        - generated_at_epoch_ms
      properties:
        query:
          type: string
        generated_at_epoch_ms:
          type: integer
    MemorySearchResult:
      type: object
      additionalProperties: false
      required:
        - notes
        - omitted_count
      properties:
        notes:
          type: array
          items:
            $ref: '#/components/schemas/MemoryNote'
        omitted_count:
          type: integer
    MemoryNote:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - content
        - tags
        - profile
        - created_at_epoch_ms
        - updated_at_epoch_ms
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
        tags:
          type: array
          items:
            type: string
        profile:
          $ref: '#/components/schemas/MemoryProfile'
        created_at_epoch_ms:
          type: integer
        updated_at_epoch_ms:
          type: integer
    ContextAssembly:
      type: object
      additionalProperties: false
      required:
        - query
        - generated_at_epoch_ms
        - snippets
        - memory_notes
        - omissions
        - budget
        - stale
      properties:
        query:
          type: string
        generated_at_epoch_ms:
          type: integer
        snippets:
          type: array
          items:
            $ref: '#/components/schemas/ContextSnippet'
        memory_notes:
          type: array
          items:
            $ref: '#/components/schemas/ContextMemoryNote'
        omissions:
          type: array
          items:
            $ref: '#/components/schemas/OmissionReason'
        budget:
          $ref: '#/components/schemas/ContextBudgetEstimate'
        stale:
          $ref: '#/components/schemas/ContextStaleStatus'
    ContextBudgetEstimate:
      type: object
      additionalProperties: false
      required:
        - included_bytes
        - approximate_tokens
      properties:
        included_bytes:
          type: integer
          description: Local byte count for text included in the bounded context packet.
        approximate_tokens:
          type: integer
          description: Local approximate token estimate derived from included bytes; not provider billing truth.
    ContextStaleStatus:
      type: object
      additionalProperties: false
      required:
        - is_stale
        - changed_files
        - missing_files
        - new_files
      properties:
        is_stale:
          type: boolean
        changed_files:
          type: integer
        missing_files:
          type: integer
        new_files:
          type: integer
    ContextSnippet:
      type: object
      additionalProperties: false
      required:
        - path
        - line_number
        - line
        - reason
      properties:
        path:
          type: string
        line_number:
          type: integer
        line:
          type: string
        reason:
          $ref: '#/components/schemas/InclusionReason'
    ContextMemoryNote:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - content
        - profile
        - reason
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
        profile:
          $ref: '#/components/schemas/MemoryProfile'
        reason:
          $ref: '#/components/schemas/InclusionReason'
    InclusionReason:
      type: object
      additionalProperties: false
      required:
        - kind
        - detail
      properties:
        kind:
          $ref: '#/components/schemas/InclusionReasonKind'
        detail:
          type: string
    OmissionReason:
      type: object
      additionalProperties: false
      required:
        - kind
        - detail
      properties:
        kind:
          $ref: '#/components/schemas/OmissionReasonKind'
        detail:
          type: string
    RetrievalLimits:
      type: object
      additionalProperties: false
      required:
        - max_context_items
        - max_snippet_pack_bytes
        - max_document_pack_bytes
        - max_memory_pack_bytes
        - max_history_runs
      properties:
        max_context_items:
          type: integer
        max_snippet_pack_bytes:
          type: integer
        max_document_pack_bytes:
          type: integer
        max_memory_pack_bytes:
          type: integer
        max_history_runs:
          type: integer
    BackendProof:
      type: object
      additionalProperties: false
      required:
        - id
        - command
      properties:
        id:
          type: string
        command:
          type: string
    RetrievalMode:
      type: string
      enum:
        - exact_search
        - overview
        - task_capsule
        - diff_aware
    MemoryProfile:
      type: string
      enum:
        - normal
        - decision
        - guardrail
    InclusionReasonKind:
      type: string
      enum:
        - query_line_match
        - overview_document
        - task_capsule_match
        - memory_note_match
        - diff_changed_file
        - diff_related_match
    OmissionReasonKind:
      type: string
      enum:
        - no_line_matches
        - no_document_matches
        - no_memory_matches
        - item_limit_reached
        - byte_budget_reached
        - missing_indexed_file
